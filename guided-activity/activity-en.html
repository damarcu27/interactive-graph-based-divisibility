<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Interactive graph-based activit for divisibility
    </title>
<link rel="stylesheet" href="style_activity.css">
</head>

<body>

    <!-- =====================================================
         TTITLE
        ===================================================== -->

    <h1>
        INTERACTIVE GRAPH-BASED ACTIVITY FOR DIVISIBILITY
    </h1>
    <div id="principal">

        <!-- =================================================
             LEFT
             ================================================= -->

        <div id="controles">

            <!-- =============================================
                 PHASE 1
                 ============================================= -->

            <div class="tarjeta">
                <h2>
                    🧩 Divisibility graph construction
                </h2>
                <div class="campo">
                    <label for="modulo">
                        Modulus
                    </label>
                    <div class="moduloFila">
                        <input
                            id="modulo"
                            type="number"
                            min="2"
                            max="20"
                            value=""
                        >
                        <button onclick="crearGrafo()">
                            Create graph
                        </button>
                    </div>
                </div>
                <button
                    id="botonComprobarGrafo"
                    onclick="comprobarGrafo()"
                    disabled
                >
                    Check graph
                </button>
                <div id="resultadoGrafo"></div>
            </div>

            <!-- =============================================
                 PHASE 2
                 ============================================= -->

            <div class="tarjeta">
                <h2>
                    🔗 Walk construction
                </h2>
                <div class="campo">
                    <label for="numero">
                        Number
                    </label>
                    <input
                        id="numero"
                        value=""
                        disabled
                        oninput="activarNuevoNumero()"
                    >
                </div>
                <button
                    id="botonRecorrido"
                    onclick="iniciarRecorrido()"
                    disabled
                >
                    Start walk
                </button>
                <button
                    id="botonComprobarRecorrido"
                    onclick="comprobarRecorrido()"
                    disabled
                >
                    Check walk
                </button>
                <div id="resultadoRecorrido"></div>
            </div>

            <!-- =============================================
                 PHASE 3
                 ============================================= -->

            <div class="tarjeta">
                <h2>
                    🎯 Final result
                </h2>
                <div class="resultadoFila">
                    <div class="campo">
                        <label for="restoFinal">
                            Final remainder
                        </label>
                        <input
                            id="restoFinal"
                            type="number"
                            min="0"
                            disabled
                            oninput="comprobarDatosFinales()"
                        >
                    </div>
                    <div class="campo">
                        <label>
                            ¿Is it divisible?
                        </label>
                        <div class="radios">
                            <label>
                                <input
                                    type="radio"
                                    name="divisible"
                                    value="si"
                                    disabled
                                    onclick="comprobarDatosFinales()"
                                >
                                Yes
                            </label>
                            <label>
                                <input
                                    type="radio"
                                    name="divisible"
                                    value="no"
                                    disabled
                                    onclick="comprobarDatosFinales()"
                                >
                                No
                            </label>
                        </div>
                    </div>
                </div>
                <button
                    id="botonResultadoFinal"
                    onclick="comprobarResultadoFinal()"
                    disabled
                >
                    Check final result
                </button>
                <div id="resultadoFinal"></div>
            </div>

            <!-- =============================================
                 FINAL BUTTONS
                 ============================================= -->

            <div class="tarjeta">
                <div class="botonesFinales">
                    <button
                        id="botonNuevoNumero"
                        onclick="nuevoNumero()"
                        disabled
                    >
                        New number
                    </button>
                    <button
                        onclick="nuevoEjercicio()"
                        class="botonNuevoEjercicio"
                    >
                        New exercise
                    </button>
                </div>
            </div>
        </div>

        <!-- =================================================
             RIGHT: GRAPH
             ================================================= -->

        <div id="zonaGrafo">
            <div id="cabeceraGrafo">
                <h2>
                    Divisibility graph
                </h2>
            	<p>
                    Graphical representation of the divisibility process
            	</p>
            </div>
            <div id="cuadroGrafo">
                <svg
                    id="grafo"
                    width="700"
                    height="700"
                >
                </svg>
            </div>
        </div>
    </div>
    <script src="activity-script-en.js"></script>
</body>

</html>
